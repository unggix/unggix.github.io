- name: "Project Experience"
  entries:
    - title: "WardrobeRL: Prompt-Aware Reinforcement Learning Based Top-Bottom Recommendation"
      subtitle: "Team Member, Second Author"
      location: "Daegu, S.Korea"
      period: "2025"
      bullets:
        - "Framed prompt-conditioned outfit recommendation as sequential decision-making rather than one-shot retrieval."
        - "Reduced a 25M-combination action space with balanced K-means over CLIP embeddings — 5,000 tops and 5,000 bottoms from DressCode into 50 clusters of 100 items each — letting a model-free PPO agent select a cluster, then an item."
        - "Designed a multimodal reward fusing CLIP text-image similarity with a lightweight MLP proxy for human preference, trained on 2,500 CatVTON virtual try-on examples."
        - "Pre-training on the CLIP reward before fine-tuning on the human-feedback proxy started ~43% lower in loss and reached the threshold in ~8% fewer steps."
        - "Lifted CLIP-T text alignment from 0.833 to 0.924 over the untrained baseline, converging in under four hours on an A100."
        - "Began as a Reinforcement Learning course project; published at ICTC 2025."

    - title: "Noise Map-Driven Dynamic Frame Processing for Improved Object Detection in Low-Light Conditions"
      subtitle: "Undergraduate Group Research Program (UGRP), Team of Four"
      location: "Daegu, S.Korea"
      period: "2024"
      bullets:
        - "Placed an enhancement front-end before YOLO — Zero-DCE for low-light enhancement, CBDNet for noise-map estimation, and MFDNet for denoising — integrated directly into the detector's data loader."
        - "Held the pipeline to real time by exploiting temporal redundancy between frames, processing one frame in five at 20 FPS."
        - "Improved mAP by roughly 1% over the unenhanced baseline on BDD100k."

